[pytest]
testpaths = tests
addopts = -p no:cacheprovider
filterwarnings =
    # third-party deprecation noise (not our code)
    ignore::PendingDeprecationWarning:shap.*
    ignore::DeprecationWarning:shap.*
    ignore::DeprecationWarning:lifelines.*
    ignore::FutureWarning:lifelines.*
    ignore::DeprecationWarning:torchtuples.*
    ignore::DeprecationWarning:pycox.*
    ignore:.*ScriptRunContext.*
